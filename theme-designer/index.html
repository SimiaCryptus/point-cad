<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Theme CAD — Point-CAD Theme Designer</title>
    <link rel="manifest" href="./manifest.webmanifest"/>
    <meta name="theme-color" content="#0a0d14"/>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            background: #0a0d14;
            color: #e6edf3;
            font: 14px/1.5 'Inter',
            system-ui,
            -apple-system,
            sans-serif;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            padding: 8px 16px;
            background: #0d1117;
            border-bottom: 1px solid #30363d;
        }

        header h1 {
            font-size: 15px;
            font-weight: 600;
            margin: 0 auto 0 0;
            color: #e6edf3;
        }

        header button {
            font: 13px/1.4 inherit;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background: #161b22;
            color: #e6edf3;
            cursor: pointer;
        }

        header button:hover {
            border-color: #58a6ff;
        }

        header button.primary {
            background: #2f6fed;
            border-color: #2f6fed;
            color: #fff;
            font-weight: 600;
        }

        point-cad {
            flex: 1;
            min-height: 0;
            display: block;
        }

        #log {
            height: 44px;
            overflow: auto;
            margin: 0;
            padding: 6px 16px;
            font: 12px ui-monospace, Menlo, Consolas, monospace;
            background: #0d1117;
            color: #8b949e;
            border-top: 1px solid #30363d;
            box-sizing: border-box;
        }

        #boot-error {
            display: none;
            padding: 1.5rem;
            font-family: ui-monospace, monospace;
            color: #ffa657;
            white-space: pre-wrap;
        }
    </style>
    <!-- manifest:seo:start (generated by scripts/apply-seo.ts — do not edit) -->
    <link href="https://math.cognotik.com/experiments/point-cad/theme-designer/index.html" rel="canonical"/>
    <meta content="A theme designer for PointCAD, allowing you to create and customize themes for your CAD projects."
          name="description"/>
    <meta content="website" property="og:type"/>
    <meta content="Mathematical Explorations" property="og:site_name"/>
    <meta content="Theme CAD" property="og:title"/>
    <meta content="A theme designer for PointCAD, allowing you to create and customize themes for your CAD projects."
          property="og:description"/>
    <meta content="https://math.cognotik.com/experiments/point-cad/theme-designer/index.html" property="og:url"/>
    <meta content="https://math.cognotik.com/assets/og-image.png" property="og:image"/>
    <meta content="https://math.cognotik.com/videos/demo_themecad.mp4" property="og:video"/>
    <meta content="summary_large_image" name="twitter:card"/>
    <meta content="Theme CAD" name="twitter:title"/>
    <meta content="A theme designer for PointCAD, allowing you to create and customize themes for your CAD projects."
          property="twitter:description"/>
    <meta content="https://math.cognotik.com/assets/og-image.png" name="twitter:image"/>
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebApplication",
            "name": "Theme CAD",
            "description": "A theme designer for PointCAD, allowing you to create and customize themes for your CAD projects.",
            "url": "https://math.cognotik.com/experiments/point-cad/theme-designer/index.html",
            "image": "https://math.cognotik.com/assets/og-image.png",
            "isPartOf": {
                "@type": "WebSite",
                "name": "Mathematical Explorations",
                "url": "https://math.cognotik.com"
            }
        }
    </script>
    <!-- manifest:seo:end -->
</head>
<body>
<header>
    <h1>Theme CAD</h1>
    <button data-action="open" title="Open a .tcad / .pcad constraint file (or pass ?src=<url>)">Open…</button>
    <button class="primary" data-action="solve">Solve themes</button>
    <button data-export="pcad" title="Save the constraint script (.pcad)">Save .pcad</button>
    <button data-export="css" title="Publish the solved CSS custom properties">Save CSS</button>
    <button data-export="tokens" title="Export W3C Design Tokens JSON">Save tokens</button>
    <button data-export="md" title="Export markdown integration guide">Save guide (.md)</button>
</header>

<point-cad
        id="cad"
        theme="dark"
        src="./theme.tcad"
        open="swatches,preview,script"
        panels="swatches,preview,handoff,variables,points,constraints,script,solve"
></point-cad>
<pre id="log"></pre>
<pre id="boot-error"></pre>

<script type="module">
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch((err) => {
            console.warn('Service worker registration skipped:', err);
        });
    }

    const HARNESS_URL = '../extensions/theme/ui/harness.js';
    try {
        const {bootHarness} = await import(HARNESS_URL);
        await bootHarness(document.getElementById('cad'), {log: document.getElementById('log')});
    } catch (err) {
        const el = document.getElementById('boot-error');
        el.style.display = 'block';
        el.textContent =
            'Could not load the theme-designer harness from "' +
            HARNESS_URL +
            '".\n\n' +
            err;
    }
</script>
</body>
</html>

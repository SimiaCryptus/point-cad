<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Point-CAD — theme designer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font:
          14px system-ui,
          sans-serif;
        background: #eef0f3;
      }
      header {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        padding: 8px 16px;
        background: #fff;
        border-bottom: 1px solid #d9dde3;
      }
      header h1 {
        font-size: 16px;
        margin: 0 auto 0 0;
      }
      point-cad {
        display: block;
        height: calc(100vh - 54px - 60px);
      }
      #log {
        height: 60px;
        overflow: auto;
        margin: 0;
        padding: 6px 16px;
        font:
          12px ui-monospace,
          Menlo,
          Consolas,
          monospace;
        background: #1d2026;
        color: #cfd3d9;
        box-sizing: border-box;
      }
      button {
        font: inherit;
        padding: 4px 10px;
      }
      button.primary {
        background: #2f6fed;
        border: 1px solid #2f6fed;
        color: #fff;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Point-CAD — constraint-solved colour themes</h1>
      <button
        data-action="open"
        title="Open a saved harness (.html), a sketch (.pcad / .json) — or drop one on the viewport"
      >
        Open…
      </button>
      <button class="primary" data-action="solve">Solve themes</button>
      <button data-export="css">Save CSS</button>
      <button data-export="tokens">Save tokens</button>
      <button data-export="pcad">Save .pcad</button>
      <button data-export="md">Save guide (.md)</button>
      <button data-export="html">Save harness (.html)</button>
    </header>

    <!-- Swatches: the solved palette. Preview: the sample page and its HTML/CSS
       templates. Handoff: emitter options, the token table, the migration-guide
       fields and the evidence (working notes). "Save guide (.md)" writes the
       integration guide for a human or an agent from those fields; "Save
       harness (.html)" writes this page with the sketch and every field embedded. -->
    <point-cad
      id="cad"
      src="./palette.pcad"
      panels="swatches,preview,handoff,variables,points,constraints,script,solve"
      open="swatches,handoff,solve"
    ></point-cad>
    <pre id="log"></pre>

    <!-- Handoff document. This demo page carries none (its sketch comes from src=
       above). A harness written by demo/analyze.op.md or by "Save harness (.html)"
       carries the sketch and every field in a block like the one below; when the
       block is present it wins over src= (drop the attribute in a saved copy so it
       does not fetch anything), which makes the file self-contained:

       <script type="application/json" id="theme-doc">
       {
         "pcad": "space oklab\nunits none deg\ngamut srgb\n…",
         "doc": {
           "project": "My app",
           "prefix": "color-", "format": "oklch", "scope": ":root",
           "switchMode": "media,attribute", "defaultTheme": "", "fallback": false,
           "summary": "…", "replacements": "…", "plumbing": "…", "alpha": "…",
           "skip": "…", "order": "…", "findings": "…",
           "inventory": "…", "tokenMap": "…", "relations": "…", "expected": "…",
           "preview": { "html": "<h2>…</h2>", "css": "body { … }" }
         }
       }
       </script>

       Every prose field is markdown; preview.html / preview.css are raw markup
       and CSS; fields left out fall back to the defaults. See demo/analyze.op.md
       §3 for what each field must contain. -->

    <script type="module">
      import { bootHarness } from '../extensions/theme/ui/harness.js';
      bootHarness(document.getElementById('cad'), { log: document.getElementById('log') });
    </script>
  </body>
</html>
